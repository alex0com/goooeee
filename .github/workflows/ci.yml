name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_app:
        description: Build the macOS app (uses macOS runner minutes)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-linux:
    name: GoooeeeKit tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install SQLite headers (GRDB) and Python (mock servers)
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3
      - name: Build
        working-directory: Packages/GoooeeeKit
        run: swift build --build-tests
      - name: Test
        working-directory: Packages/GoooeeeKit
        run: swift test --skip-build

  # macOS runners cost more, so the app build only runs when started by hand.
  app-macos:
    name: App build (macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.build_app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || xcodebuild -version
      - name: Package tests
        working-directory: Packages/GoooeeeKit
        run: swift test
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app
        shell: bash
        run: |
          xcodebuild -project goooeee.xcodeproj -scheme goooeee -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-build-log
          path: build.log
